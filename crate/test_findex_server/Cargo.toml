[package]
name = "test_findex_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Run a test Findex server for testing purposes"

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
non-fips = ["cosmian_findex_client/non-fips"]

[dependencies]
actix-server = { workspace = true }
cosmian_findex_client = { path = "../findex_client", version = "0.4.14" }
cosmian_findex_server = { path = "../server", features = [
  "insecure",
], version = "0.4.14" }
# Pin transitive KMS deps to ~5.16.1 (their crates.io ^5.16.1 ranges float to 5.22.0 which has breaking changes)
cosmian_kmip = { workspace = true }
cosmian_kms_access = { workspace = true }
cosmian_kms_client = { workspace = true }
cosmian_kms_client_utils = { workspace = true }
cosmian_kms_crypto = { workspace = true }
cosmian_logger = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["cosmian_kmip", "cosmian_kms_access", "cosmian_kms_client", "cosmian_kms_client_utils", "cosmian_kms_crypto"]
